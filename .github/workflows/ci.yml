name: Helpdesk CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
          - name: Configurar Java 25
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '25'
                cache: 'maven'

           - name: Executar testes
             run: ./mvnw clean test