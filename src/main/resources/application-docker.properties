spring.datasource.url=jdbc:mysql://mysql:3306/helpdesk
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
notificacao.service.url=http://notificacao-service:8081

jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=helpdesk.exchange
app.rabbitmq.queue=helpdesk.chamado-criado.queue
app.rabbitmq.routing-key=chamado.criado

