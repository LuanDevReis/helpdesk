# Configurações de Porta e Segurança
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# Configurações Dinâmicas do Banco de Dados
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Integração de Microsserviços e Mensageria
notificacao.service.url=${NOTIFICACAO_SERVICE_URL}
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES}

# Placeholders de Filas do RabbitMQ
app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE}
app.rabbitmq.queue=${APP_RABBITMQ_QUEUE}
app.rabbitmq.routing-key=${APP_RABBITMQ_ROUTING_KEY}



